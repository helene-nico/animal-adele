<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mon Animal Virtuel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Flux vidéo -->
  <video id="camera" autoplay playsinline muted></video>

  <!-- Effet de Flash pour la photo -->
  <div id="flash" class="hidden"></div>

  <!-- Menu principal -->
  <div id="ui-container">
    <h1>Choisis ton compagnon</h1>
    <div class="pet-buttons">
      <button class="btn" data-pet="🐶">Chien</button>
      <button class="btn" data-pet="🐱">Chat</button>
      <button class="btn" data-pet="🐰">Lapin</button>
    </div>
    <button id="feed-btn" class="btn hidden" style="background-color: #10b981; color: white; margin-top: 10px;">
      🍽️ Nourrir
    </button>
  </div>

  <!-- Éléments du jeu -->
  <div id="pet" class="hidden">🐶</div>
  <div id="food" class="hidden"></div>
  <div id="reaction" class="hidden">❤️</div>

  <!-- NOUVEAU : Bouton Appareil Photo -->
  <button id="photo-btn" class="hidden">📸</button>

  <script src="app.js"></script>
</body>
</html>
